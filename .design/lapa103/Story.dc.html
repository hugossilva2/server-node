<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; }
    a { color: #d8a544; } a:hover { color: #eec37a; }
  </style>
</helmet>
<div style="width: 1080px; height: 1920px; display: flex; flex-direction: column; overflow: hidden; background: {{bg}}; font-family: 'Helvetica Neue', Helvetica, system-ui, sans-serif;">

  <div style="height: 950px; position: relative; background-image: url(./santuario-story.jpg); background-size: cover; background-position: center 8%;">
    <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 190px; background: {{scrim}};"></div>
  </div>

  <div style="height: 18px; background-image: url(./fitas.jpg); background-size: cover; background-position: center;"></div>

  <div style="flex-grow: 1; display: flex; flex-direction: column; justify-content: space-between; padding: 68px 72px 76px;">

    <div style="display: flex; flex-direction: column; gap: 20px;">
      <div style="display: flex; align-items: center; gap: 16px;">
        <div style="width: 52px; height: 2px; background: {{accent}};"></div>
        <div style="font-size: 22px; letter-spacing: 6px; font-weight: 600; color: {{accent}};">31 DE AGOSTO</div>
      </div>
      <div style="font-family: Georgia, 'Times New Roman', serif; font-size: 88px; font-weight: 700; line-height: 1.02; letter-spacing: -1px; color: #f4efe4;">BOM JESUS<br>DA LAPA</div>
      <div style="font-family: Georgia, 'Times New Roman', serif; font-style: italic; font-size: 34px; color: {{accent}};">Capital Baiana da Fé</div>
    </div>

    <div style="display: flex; align-items: flex-end; gap: 30px;">
      <div style="font-family: Georgia, 'Times New Roman', serif; font-size: 232px; font-weight: 700; line-height: 0.82; letter-spacing: -8px; color: {{accent}};">103</div>
      <div style="padding-bottom: 20px; font-size: 20px; letter-spacing: 3.5px; font-weight: 600; line-height: 1.7; color: rgba(244, 239, 228, 0.7);">ANOS DE<br>EMANCIPAÇÃO</div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 30px;">
      <div style="font-size: 26px; line-height: 1.5; color: rgba(244, 239, 228, 0.74); text-wrap: pretty;">Parabéns à terra que acolhe o Brasil inteiro em romaria e ensina, todo dia, a força da fé e do trabalho.</div>
      <div style="height: 1px; background: rgba(216, 165, 68, 0.28);"></div>
      <div style="display: flex; align-items: center; justify-content: space-between; gap: 24px;">
        <div style="width: 300px; height: 92px; border: 2px dashed rgba(216, 165, 68, 0.55); display: flex; align-items: center; justify-content: center; font-size: 13px; letter-spacing: 3px; font-weight: 600; color: rgba(216, 165, 68, 0.85); text-align: center;">LOGO DO CANDIDATO</div>
        <div style="font-size: 22px; letter-spacing: 2px; color: rgba(244, 239, 228, 0.5);">1923 · 2026</div>
      </div>
    </div>

  </div>
</div>
</x-dc>
<script data-dc-script data-props='{"accent":{"editor":"color","default":"#d8a544","options":["#d8a544","#c8622e","#2f7d6b","#b8352f"]},"bg":{"editor":"color","default":"#0d2436","options":["#0d2436","#12301c","#2a1120","#1c1c1c"]},"$preview":{"width":1080,"height":1920}}'>
class Component extends DCLogic {
  renderVals() {
    var bg = this.props.bg ?? '#0d2436';
    var h = bg.replace('#', '');
    if (h.length === 3) { h = h[0] + h[0] + h[1] + h[1] + h[2] + h[2]; }
    var rgba0 = 'rgba(' + parseInt(h.slice(0, 2), 16) + ', ' + parseInt(h.slice(2, 4), 16) + ', ' + parseInt(h.slice(4, 6), 16) + ', 0)';
    return {
      accent: this.props.accent ?? '#d8a544',
      bg: bg,
      scrim: 'linear-gradient(to bottom, ' + rgba0 + ', ' + bg + ')'
    };
  }
}
</script>
</body>
</html>
