<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; }
    a { color: #d8a544; } a:hover { color: #eec37a; }
  </style>
</helmet>
<div style="width: 1080px; height: 1080px; display: flex; flex-direction: column; overflow: hidden; background: {{bg}}; font-family: 'Helvetica Neue', Helvetica, system-ui, sans-serif;">

  <div style="flex-grow: 1; display: flex; align-items: stretch;">

    <div style="width: 452px; background-image: url(./santuario.jpg); background-size: cover; background-position: 52% 30%;"></div>

    <div style="flex-grow: 1; display: flex; flex-direction: column; justify-content: space-between; padding: 66px 54px 58px 50px;">

      <div style="display: flex; flex-direction: column; gap: 16px;">
        <div style="display: flex; align-items: center; gap: 14px;">
          <div style="width: 44px; height: 2px; background: {{accent}};"></div>
          <div style="font-size: 19px; letter-spacing: 5px; font-weight: 600; color: {{accent}};">31 DE AGOSTO</div>
        </div>
        <div style="font-family: Georgia, 'Times New Roman', serif; font-size: 68px; font-weight: 700; line-height: 1.02; letter-spacing: -0.5px; color: #f4efe4;">BOM JESUS<br>DA LAPA</div>
        <div style="font-family: Georgia, 'Times New Roman', serif; font-style: italic; font-size: 27px; color: {{accent}};">Capital Baiana da Fé</div>
      </div>

      <div style="display: flex; flex-direction: column; gap: 10px;">
        <div style="font-family: Georgia, 'Times New Roman', serif; font-size: 205px; font-weight: 700; line-height: 0.84; letter-spacing: -6px; color: {{accent}};">103</div>
        <div style="font-size: 17px; letter-spacing: 3.5px; font-weight: 600; color: rgba(244, 239, 228, 0.7);">ANOS DE EMANCIPAÇÃO</div>
      </div>

      <div style="display: flex; flex-direction: column; gap: 26px;">
        <div style="font-size: 21px; line-height: 1.5; color: rgba(244, 239, 228, 0.74); text-wrap: pretty;">Parabéns à terra que acolhe o Brasil inteiro em romaria e ensina, todo dia, a força da fé e do trabalho.</div>
        <div style="height: 1px; background: rgba(216, 165, 68, 0.28);"></div>
        <div style="display: flex; align-items: center; justify-content: space-between; gap: 20px;">
          <div style="width: 252px; height: 78px; border: 2px dashed rgba(216, 165, 68, 0.55); display: flex; align-items: center; justify-content: center; font-size: 12px; letter-spacing: 3px; font-weight: 600; color: rgba(216, 165, 68, 0.85); text-align: center;">LOGO DO CANDIDATO</div>
          <div style="font-size: 19px; letter-spacing: 2px; color: rgba(244, 239, 228, 0.5);">1923 · 2026</div>
        </div>
      </div>

    </div>
  </div>

  <div style="height: 18px; background-image: url(./fitas.jpg); background-size: cover; background-position: center;"></div>
</div>
</x-dc>
<script data-dc-script data-props='{"accent":{"editor":"color","default":"#d8a544","options":["#d8a544","#c8622e","#2f7d6b","#b8352f"]},"bg":{"editor":"color","default":"#0d2436","options":["#0d2436","#12301c","#2a1120","#1c1c1c"]},"$preview":{"width":1080,"height":1080}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      accent: this.props.accent ?? '#d8a544',
      bg: this.props.bg ?? '#0d2436'
    };
  }
}
</script>
</body>
</html>
