<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; }
    a { color: #0d2436; } a:hover { color: #d8a544; }
  </style>
</helmet>
<div style="width: 1080px; height: 1080px; overflow: hidden; background: #f2ece0; padding: 44px; box-sizing: border-box; font-family: 'Helvetica Neue', Helvetica, system-ui, sans-serif;">
  <div style="height: 100%; box-sizing: border-box; border: 1px solid rgba(13, 36, 54, 0.22); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 30px; padding: 56px 72px 0;">

    <div style="font-size: 16px; letter-spacing: 7px; font-weight: 600; color: rgba(13, 36, 54, 0.55);">BAHIA · BRASIL</div>

    <div style="width: 64px; height: 2px; background: {{accent}};"></div>

    <div style="display: flex; flex-direction: column; align-items: center; gap: 14px;">
      <div style="font-family: Georgia, 'Times New Roman', serif; font-size: 232px; font-weight: 700; line-height: 0.82; letter-spacing: -8px; color: #0d2436;">103</div>
      <div style="font-size: 17px; letter-spacing: 5px; font-weight: 600; color: {{accent}};">ANOS DE EMANCIPAÇÃO</div>
    </div>

    <div style="width: 100%; height: 1px; background: rgba(13, 36, 54, 0.18);"></div>

    <div style="display: flex; flex-direction: column; align-items: center; gap: 12px;">
      <div style="font-family: Georgia, 'Times New Roman', serif; font-size: 62px; font-weight: 700; letter-spacing: -0.5px; line-height: 1.05; color: #0d2436; text-align: center;">BOM JESUS DA LAPA</div>
      <div style="font-family: Georgia, 'Times New Roman', serif; font-style: italic; font-size: 28px; color: rgba(13, 36, 54, 0.62);">Capital Baiana da Fé</div>
    </div>

    <div style="font-size: 19px; letter-spacing: 3px; color: rgba(13, 36, 54, 0.5);">31 DE AGOSTO · 1923 — 2026</div>

    <div style="flex-grow: 1;"></div>

    <div style="width: 252px; height: 78px; border: 2px dashed rgba(13, 36, 54, 0.35); display: flex; align-items: center; justify-content: center; font-size: 12px; letter-spacing: 3px; font-weight: 600; color: rgba(13, 36, 54, 0.6); text-align: center;">LOGO DO CANDIDATO</div>

    <div style="width: 100%; height: 16px; background-image: url(./fitas.jpg); background-size: cover; background-position: center;"></div>

  </div>
</div>
</x-dc>
<script data-dc-script data-props='{"accent":{"editor":"color","default":"#c8912f","options":["#c8912f","#c8622e","#2f7d6b","#b8352f"]},"$preview":{"width":1080,"height":1080}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#c8912f' };
  }
}
</script>
</body>
</html>
